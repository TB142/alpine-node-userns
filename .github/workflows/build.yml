name: build-alpine-node-userns

on:
  schedule:
    # Weekly, Monday 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:
# Deliberately no `push:` trigger

permissions:
  contents: read
  packages: write        # push to ghcr.io with the built-in GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # aarch64 target, add linux/amd64 to platforms:
      # if you ever want the same image on a desktop.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI tags must be lowercase — repo usernames may contain uppercase.
      - id: meta
        run: |
          echo "image=$(echo ghcr.io/${{ github.repository_owner }}/alpine-node-userns | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "v=$(grep -m1 '^FROM alpine:' Containerfile | sed -E 's/^FROM alpine:([0-9.]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.v }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
